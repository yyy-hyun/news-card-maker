<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>뉴스 카드 제작자</title>
<style>
body{margin:0;background:#101827;color:white;font-family:Arial,sans-serif;text-align:center;padding:30px 18px}
h1{margin-top:45px}
p{color:#cbd5e1}
button{display:block;width:100%;max-width:380px;margin:15px auto;padding:17px;border:0;border-radius:12px;background:#2563eb;color:white;font-size:17px}
input{box-sizing:border-box;width:100%;max-width:380px;padding:15px;border-radius:10px;border:1px solid #94a3b8;font-size:16px}
#linkBox{display:none;margin-top:25px}
#result{margin:20px auto;max-width:380px;overflow-wrap:anywhere;text-align:left;line-height:1.6}
a{color:#93c5fd}
</style>
</head>
<body>
<h1>📰 뉴스 카드 제작자</h1>
<p>해외의 흥미로운 뉴스를 나만의 카드뉴스로 만들어 보세요!</p>
<button onclick="showLink()">🔗 뉴스 링크 입력</button>
<button onclick="showMessage('오늘의 추천 뉴스')">🌍 오늘의 추천 뉴스</button>
<button onclick="showMessage('내 카드뉴스')">🗂️ 내 카드뉴스</button>
<div id="linkBox">
<h2>뉴스 주소를 붙여넣으세요</h2>
<input id="newsUrl" type="url" placeholder="https://example.com/news">
<button onclick="checkLink()">뉴스 정보 확인하기</button>
</div>
<div id="result" aria-live="polite"></div>
<script>
let newsTitle='';
let newsDescription='';
function showLink(){
document.getElementById('linkBox').style.display='block';
document.getElementById('result').textContent='';
}
function showMessage(name){
document.getElementById('result').textContent=name+' 기능은 다음 단계에서 만들 예정이에요.';
}
function safe(text){return String(text||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
async function checkLink(){
const url=document.getElementById('newsUrl').value.trim();
const result=document.getElementById('result');
let parsed;
try{
parsed=new URL(url);
if(!['http:','https:'].includes(parsed.protocol))throw Error();
}catch(e){result.textContent='올바른 인터넷 주소를 입력해 주세요.';return;}
result.textContent='뉴스 정보를 확인하고 있어요...';
try{
const response=await fetch('https://api.microlink.io?url='+encodeURIComponent(parsed.href));
if(!response.ok)throw Error('request failed');
const json=await response.json();
if(json.status!=='success'||!json.data)throw Error('no data');
newsTitle=json.data.title||'제목을 가져오지 못했어요.';
newsDescription=json.data.description||'기사 설명을 가져오지 못했어요.';
result.innerHTML='<h3>'+safe(newsTitle)+'</h3><p>'+safe(newsDescription)+'</p><button onclick="translateNews()">🇰🇷 한글로 번역하기</button><a href="'+safe(parsed.href)+'" target="_blank" rel="noopener noreferrer">원문 기사 열기</a><div id="translation"></div>';
}catch(e){
result.innerHTML='<p>뉴스 정보를 자동으로 가져오지 못했어요.</p><a href="'+safe(parsed.href)+'" target="_blank" rel="noopener noreferrer">원문 기사 열기</a>';
}
}
async function translateNews(){
const target=document.getElementById('translation');
target.textContent='번역 중이에요...';
try{
const translate=async text=>{
const url='https://api.mymemory.translated.net/get?q='+encodeURIComponent(text.slice(0,450))+'&langpair=en|ko';
const response=await fetch(url);
if(!response.ok)throw Error();
const data=await response.json();
if(data.responseStatus!==200||!data.responseData?.translatedText)throw Error();
return data.responseData.translatedText;
};
const title=await translate(newsTitle);
const description=await translate(newsDescription);
target.innerHTML='<h3>🇰🇷 한글 번역</h3><p><strong>'+safe(title)+'</strong></p><p>'+safe(description)+'</p><small>자동 번역 결과이므로 원문과 비교해 주세요.</small>';
}catch(e){
target.textContent='자동 번역에 실패했어요. 무료 번역 서비스의 사용량 또는 접속 제한 때문일 수 있어요.';
}
}
</script>
</body>
</html>
