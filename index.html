<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>뉴스 카드 제작자</title>
<style>
body{margin:0;background:#101827;color:white;font-family:Arial,sans-serif;text-align:center;padding:30px 18px}
h1{margin-top:45px}
p{color:#cbd5e1}
button{display:block;width:100%;max-width:380px;margin:15px auto;padding:17px;border:0;border-radius:12px;background:#2563eb;color:white;font-size:17px}
input{box-sizing:border-box;width:100%;max-width:380px;padding:15px;border-radius:10px;border:1px solid #94a3b8;font-size:16px}
#linkBox{display:none;margin-top:25px}
#result{margin:20px auto;max-width:380px;overflow-wrap:anywhere;text-align:left;line-height:1.6}
a{color:#93c5fd}
</style>
</head>
<body>
<h1>📰 뉴스 카드 제작자</h1>
<p>해외의 흥미로운 뉴스를 나만의 카드뉴스로 만들어 보세요!</p>
<button onclick="showLink()">🔗 뉴스 링크 입력</button>
<button onclick="showMessage('오늘의 추천 뉴스')">🌍 오늘의 추천 뉴스</button>
<button onclick="showMessage('내 카드뉴스')">🗂️ 내 카드뉴스</button>
<div id="linkBox">
<h2>뉴스 주소를 붙여넣으세요</h2>
<input id="newsUrl" type="url" placeholder="https://example.com/news">
<button onclick="checkLink()">뉴스 정보 확인하기</button>
</div>
<div id="result" aria-live="polite"></div>
<script>
function showLink(){
document.getElementById('linkBox').style.display='block';
document.getElementById('result').textContent='';
}
function showMessage(name){
document.getElementById('result').textContent=name+' 기능은 다음 단계에서 만들 예정이에요.';
}
function safe(text){return String(text||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
async function checkLink(){
const url=document.getElementById('newsUrl').value.trim();
const result=document.getElementById('result');
let parsed;
try{
parsed=new URL(url);
if(!['http:','https:'].includes(parsed.protocol))throw Error();
}catch(e){result.textContent='올바른 인터넷 주소를 입력해 주세요.';return;}
result.textContent='뉴스 정보를 확인하고 있어요...';
try{
const endpoint='https://api.microlink.io?url='+encodeURIComponent(parsed.href);
const response=await fetch(endpoint);
if(!response.ok)throw Error('request failed');
const json=await response.json();
if(json.status!=='success'||!json.data)throw Error('no data');
const title=json.data.title||'제목을 가져오지 못했어요.';
const description=json.data.description||'기사 설명을 가져오지 못했어요.';
result.innerHTML='<h3>'+safe(title)+'</h3><p>'+safe(description)+'</p><a href="'+safe(parsed.href)+'" target="_blank" rel="noopener noreferrer">원문 기사 열기</a>';
}catch(e){
result.innerHTML='<p>이 사이트의 뉴스 정보를 자동으로 가져오지 못했어요. 사이트 제한이나 서비스 사용량 때문일 수 있어요.</p><a href="'+safe(parsed.href)+'" target="_blank" rel="noopener noreferrer">원문 기사 열기</a>';
}
}
</script>
</body>
</html>
