<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>뉴스 카드 제작자</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101827;color:white;font-family:Arial,sans-serif;text-align:center;padding:25px 16px}
h1{margin-top:30px}
p{color:#cbd5e1;line-height:1.6}
button{display:block;width:100%;max-width:380px;margin:14px auto;padding:16px;border:0;border-radius:12px;background:#2563eb;color:white;font-size:16px;cursor:pointer}
input,textarea{width:100%;max-width:380px;padding:14px;border-radius:10px;border:1px solid #94a3b8;font-size:16px}
input[type=file]{background:#1e293b;color:white;padding:12px}
textarea{min-height:90px;resize:vertical}
#linkBox,#cardsArea{display:none;margin-top:25px}
#result{margin:20px auto;max-width:380px;overflow-wrap:anywhere;text-align:left;line-height:1.6}
a{color:#93c5fd}
.card{width:100%;max-width:360px;aspect-ratio:4/5;margin:20px auto;padding:25px;display:flex;flex-direction:column;justify-content:center;align-items:center;background:linear-gradient(145deg,#1d4ed8,#0f172a);border:2px solid #60a5fa;border-radius:12px;overflow:hidden;overflow-wrap:anywhere;position:relative}
.cardPhoto{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:none}
.cardShade{position:absolute;inset:0;background:linear-gradient(to bottom,rgba(0,0,0,.35),rgba(0,0,0,.65));display:none}
.cardText{position:relative;z-index:1;width:100%}
.card h2{font-size:25px;line-height:1.4}
.card p{font-size:18px;color:white;white-space:pre-wrap}
.card small{color:#bfdbfe}
.editor{max-width:380px;margin:12px auto 30px;text-align:left}
.editor label{display:block;margin:10px 0 5px}
.saveBtn{background:#059669}
</style>
</head>
<body>
<h1>📰 뉴스 카드 제작자</h1>
<p>해외의 흥미로운 뉴스를 나만의 카드뉴스로 만들어 보세요!</p>
<button onclick="showLink()">🔗 뉴스 링크 입력</button>
<button onclick="showMessage('오늘의 추천 뉴스')">🌍 오늘의 추천 뉴스</button>
<button onclick="showMessage('내 카드뉴스')">🗂️ 내 카드뉴스</button>
<div id="linkBox">
<h2>뉴스 주소를 붙여넣으세요</h2>
<input id="newsUrl" type="url" placeholder="https://example.com/news">
<button onclick="checkLink()">뉴스 정보 확인하기</button>
</div>
<div id="result" aria-live="polite"></div>
<section id="cardsArea">
<h2>📱 카드뉴스 5장 미리보기</h2>
<p>사진과 문구를 수정한 뒤 각 카드의 저장 버튼을 누르세요.</p>
<div id="cards"></div>
</section>
<script>
let newsTitle='',newsDescription='',translatedTitle='',translatedDescription='';
const cardData=[];
function safe(text){return String(text||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\'':'&#39;'}[c]));}
function showLink(){
document.getElementById('linkBox').style.display='block';
document.getElementById('result').textContent='';
document.getElementById('cardsArea').style.display='none';
}
function showMessage(name){
document.getElementById('result').textContent=name+' 기능은 다음 단계에서 만들 예정이에요.';
}
async function checkLink(){
const url=document.getElementById('newsUrl').value.trim();
const result=document.getElementById('result');
let parsed;
try{
parsed=new URL(url);
if(!['http:','https:'].includes(parsed.protocol))throw Error();
}catch(e){result.textContent='올바른 인터넷 주소를 입력해 주세요.';return;}
result.textContent='뉴스 정보를 확인하고 있어요...';
document.getElementById('cardsArea').style.display='none';
try{
const response=await fetch('https://api.microlink.io?url='+encodeURIComponent(parsed.href));
if(!response.ok)throw Error();
const json=await response.json();
if(json.status!=='success'||!json.data)throw Error();
newsTitle=json.data.title||'제목을 가져오지 못했어요.';
newsDescription=json.data.description||'기사 설명을 가져오지 못했어요.';
translatedTitle='';translatedDescription='';
result.innerHTML='<h3>'+safe(newsTitle)+'</h3><p>'+safe(newsDescription)+'</p><button onclick="translateNews()">🇰🇷 한글로 번역하기</button><a href="'+safe(parsed.href)+'" target="_blank" rel="noopener noreferrer">원문 기사 열기</a><div id="translation"></div>';
}catch(e){
result.innerHTML='<p>뉴스 정보를 자동으로 가져오지 못했어요.</p><a href="'+safe(parsed.href)+'" target="_blank" rel="noopener noreferrer">원문 기사 열기</a>';
}
}
async function translateNews(){
const target=document.getElementById('translation');
target.textContent='번역 중이에요...';
try{
const translate=async text=>{
const url='https://api.mymemory.translated.net/get?q='+encodeURIComponent(text.slice(0,450))+'&langpair=en|ko';
const response=await fetch(url);
if(!response.ok)throw Error();
const data=await response.json();
if(data.responseStatus!==200||!data.responseData?.translatedText)throw Error();
return data.responseData.translatedText;
};
translatedTitle=await translate(newsTitle);
translatedDescription=await translate(newsDescription);
target.innerHTML='<h3>🇰🇷 한글 번역</h3><p><strong>'+safe(translatedTitle)+'</strong></p><p>'+safe(translatedDescription)+'</p><small>자동 번역이므로 원문과 비교해 주세요.</small><button onclick="makeCards()">📰 카드뉴스 5장 만들기</button>';
}catch(e){
target.textContent='자동 번역에 실패했어요. 무료 번역 서비스의 사용량 또는 접속 제한 때문일 수 있어요.';
}
}
function makeCards(){
const title=translatedTitle||newsTitle;
const desc=translatedDescription||newsDescription;
const parts=[
['무슨 일이 있었을까요?',title],
['해외에서 전해진 소식',desc],
['어떤 상황이었을까요?',desc],
['핵심 내용 살펴보기',title],
['여러분은 어떻게 생각하세요?','자세한 사실은 원문 기사를 확인해 주세요.']
];
const container=document.getElementById('cards');
container.innerHTML='';
cardData.length=0;
parts.forEach((part,i)=>{
cardData.push({title:part[0],body:part[1],image:null});
const wrapper=document.createElement('div');
const card=document.createElement('div');
card.className='card';
const photo=document.createElement('img');
photo.className='cardPhoto';
const shade=document.createElement('div');
shade.className='cardShade';
const textBox=document.createElement('div');
textBox.className='cardText';
const num=document.createElement('small');
num.textContent=(i+1)+' / 5';
const heading=document.createElement('h2');
heading.textContent=part[0];
const para=document.createElement('p');
para.textContent=part[1];
textBox.append(num,heading,para);
card.append(photo,shade,textBox);
const editor=document.createElement('div');
editor.className='editor';
const photoLabel=document.createElement('label');
photoLabel.textContent='📸 '+(i+1)+'장 배경 사진 선택';
const file=document.createElement('input');
file.type='file';file.accept='image/*';
file.addEventListener('change',()=>{
const chosen=file.files&&file.files[0];
if(!chosen)return;
if(!chosen.type.startsWith('image/')){alert('이미지 파일을 선택해 주세요.');return;}
const reader=new FileReader();
reader.onload=()=>{
const img=new Image();
img.onload=()=>{
cardData[i].image=img;
photo.src=reader.result;
photo.style.display='block';
shade.style.display='block';
};
img.onerror=()=>alert('이미지를 열지 못했어요.');
img.src=reader.result;
};
reader.readAsDataURL(chosen);
});
const label1=document.createElement('label');
label1.textContent=(i+1)+'장 제목 수정';
const input=document.createElement('input');
input.value=part[0];
input.addEventListener('input',()=>{heading.textContent=input.value;cardData[i].title=input.value;});
const label2=document.createElement('label');
label2.textContent=(i+1)+'장 내용 수정';
const textarea=document.createElement('textarea');
textarea.value=part[1];
textarea.addEventListener('input',()=>{para.textContent=textarea.value;cardData[i].body=textarea.value;});
const save=document.createElement('button');
save.className='saveBtn';
save.textContent='📥 '+(i+1)+'장 PNG 저장하기';
save.addEventListener('click',()=>saveCard(i));
editor.append(photoLabel,file,label1,input,label2,textarea,save);
wrapper.append(card,editor);
container.appendChild(wrapper);
});
document.getElementById('cardsArea').style.display='block';
document.getElementById('cardsArea').scrollIntoView({behavior:'smooth'});
}
function wrapLines(ctx,text,maxWidth){
const lines=[];
String(text).split('\n').forEach(paragraph=>{
let line='';
for(const ch of paragraph){
if(ctx.measureText(line+ch).width>maxWidth&&line){lines.push(line);line=ch;}
else line+=ch;
}
lines.push(line);
});
return lines;
}
function drawCentered(ctx,lines,y,lineHeight,maxLines){
lines.slice(0,maxLines).forEach((line,i)=>ctx.fillText(line,540,y+i*lineHeight));
}
function saveCard(i){
const data=cardData[i];
if(!data)return;
const canvas=document.createElement('canvas');
canvas.width=1080;canvas.height=1350;
const ctx=canvas.getContext('2d');
if(data.image){
const img=data.image;
const scale=Math.max(1080/img.width,1350/img.height);
const w=img.width*scale,h=img.height*scale;
ctx.drawImage(img,(1080-w)/2,(1350-h)/2,w,h);
const overlay=ctx.createLinearGradient(0,0,0,1350);
overlay.addColorStop(0,'rgba(0,0,0,.35)');
overlay.addColorStop(1,'rgba(0,0,0,.7)');
ctx.fillStyle=overlay;ctx.fillRect(0,0,1080,1350);
}else{
const gradient=ctx.createLinearGradient(0,0,1080,1350);
gradient.addColorStop(0,'#1d4ed8');
gradient.addColorStop(1,'#0f172a');
ctx.fillStyle=gradient;ctx.fillRect(0,0,1080,1350);
}
ctx.strokeStyle='#60a5fa';ctx.lineWidth=12;
ctx.strokeRect(18,18,1044,1314);
ctx.textAlign='center';ctx.textBaseline='middle';
ctx.fillStyle='#bfdbfe';ctx.font='36px sans-serif';
ctx.fillText((i+1)+' / 5',540,150);
ctx.fillStyle='#ffffff';ctx.font='bold 62px sans-serif';
const titles=wrapLines(ctx,data.title,900);
const titleLines=titles.slice(0,5);
drawCentered(ctx,titleLines,320,85,5);
ctx.font='42px sans-serif';
const bodies=wrapLines(ctx,data.body,890);
const bodyLines=bodies.slice(0,12);
const bodyStart=Math.max(760,410+titleLines.length*85);
drawCentered(ctx,bodyLines,bodyStart,62,12);
canvas.toBlob(blob=>{
if(!blob){alert('이미지를 만들지 못했어요.');return;}
const url=URL.createObjectURL(blob);
const a=document.createElement('a');
a.href=url;a.download='cardnews-'+(i+1)+'.png';
document.body.appendChild(a);a.click();a.remove();
setTimeout(()=>URL.revokeObjectURL(url),10000);
},'image/png');
}
</script>
</body>
</html>
