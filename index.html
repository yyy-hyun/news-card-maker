<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>뉴스 카드 제작자</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#101827;color:white;font-family:Arial,sans-serif;padding:32px 20px;text-align:center}h1{margin:45px 0 12px;font-size:30px}p{color:#cbd5e1;line-height:1.6}.menu{margin-top:45px;display:grid;gap:16px}button{width:100%;padding:23px;border:0;border-radius:16px;background:#3b82f6;color:white;font-size:19px;font-weight:bold}button:nth-child(2){background:#2563eb}button:nth-child(3){background:#1d4ed8}#message{margin-top:25px;color:#fde68a}
</style>
</head>
<body>
<h1>📰 뉴스 카드 제작자</h1>
<p>해외의 흥미로운 뉴스를<br>나만의 카드뉴스로 만들어 보세요!</p>
<div class="menu">
<button onclick="showMessage('뉴스 링크 입력')">🔗 뉴스 링크 입력</button>
<button onclick="showMessage('오늘의 추천 뉴스')">🌍 오늘의 추천 뉴스</button>
<button onclick="showMessage('내 카드뉴스')">🗂️ 내 카드뉴스</button>
</div>
<p id="message"></p>
<script>
function showMessage(name){document.getElementById("message").textContent=name+" 기능은 다음 단계에서 만들 예정이에요.";}
</script>
</body>
</html>
